<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Analytics — PrinceXmahto Study</title><link rel="icon" href="assets/princexmahto-logo.svg"><style>:root{--bg:#050d18;--panel:#0b1829;--line:#203852;--text:#f7fbff;--muted:#91a7bd;--gold:#d4af37;--ok:#68d391;--danger:#ff8e8e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#12304d 0,#050d18 42%);color:var(--text);font:14px Inter,Arial,sans-serif;min-height:100vh}.wrap{max-width:1550px;margin:auto;padding:28px 18px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.brand{display:flex;gap:13px;align-items:center}.brand img{width:46px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:900}.top h1{margin:5px 0;font-size:30px}.muted{color:var(--muted)}button,input,select{border:1px solid var(--line);background:#081525;color:var(--text);border-radius:11px;padding:10px 12px}button{cursor:pointer}.security{margin:18px 0;padding:11px 14px;border:1px solid #25445e;border-radius:12px;background:#091727;color:#b9cce0}.security b{color:var(--ok)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}.stat,.panel{background:rgba(11,24,41,.95);border:1px solid var(--line);border-radius:17px}.stat{padding:17px}.stat b{display:block;font-size:27px;margin-top:7px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}.panel{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1250px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:#b8c9db;font-size:12px;position:sticky;top:0;background:#0c1a2b;z-index:2}td small{color:var(--muted)}code{color:#dbe8f5}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#13263a;border:1px solid #28445e;font-size:11px}.danger{color:var(--danger)}.empty{padding:30px;text-align:center;color:var(--muted)}#app{display:none}.location{line-height:1.4}.user strong{display:block}.user span{font-size:12px;color:var(--muted)}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:18px 12px}.top h1{font-size:24px}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="top"><div class="brand"><img src="assets/princexmahto-logo.svg"><div><div class="eyebrow">PRINCEXMAHTO STUDY · PRIVATE</div><h1>Visitor Analytics</h1><div id="adminIdentity" class="muted">Secure admin dashboard</div></div></div><div><button id="refresh">↻ Refresh</button> <button id="logout">Sign out</button></div></header><div id="status" class="security">🔐 Initializing administrator dashboard…</div><div id="loginBox" class="security" style="display:none">You are not signed in. <button onclick="location.href='login.html'">Open secure login</button></div><section id="app"><div class="grid"><div class="stat"><span class="muted">Events</span><b id="events">—</b></div><div class="stat"><span class="muted">Sessions</span><b id="sessions">—</b></div><div class="stat"><span class="muted">Visitors</span><b id="visitors">—</b></div><div class="stat"><span class="muted">Registered</span><b id="registered">—</b></div><div class="stat"><span class="muted">Cities</span><b id="cities">—</b></div></div><div class="filters"><select id="range"><option value="1">Today</option><option value="7" selected>7 days</option><option value="30">30 days</option><option value="90">90 days</option></select><select id="type"><option value="">All events</option><option value="page_view">Page views</option><option value="click">Clicks</option><option value="page_exit">Page exits</option></select><input id="search" style="min-width:300px" placeholder="Search name, email, IP, city, page, action…"></div><section class="panel"><table><thead><tr><th>Time</th><th>Visitor / Account</th><th>Location</th><th>IP</th><th>Page</th><th>Action</th><th>Session</th><th>Device / Browser</th></tr></thead><tbody id="rows"></tbody></table></section></section></main><script>
const URL='https://dvoioacvqrujywwqqygo.supabase.co';const KEY='sb_publishable_XJ-KHZyM2H9-ADJudvRKlw_9Mr17W1J';const $=id=>document.getElementById(id);let all=[],lastLoadedAt=null;
function esc(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]||m))}
function device(ua){ua=ua||'';let os=/Windows/i.test(ua)?'Windows':/Android/i.test(ua)?'Android':/iPhone|iPad|iPod/i.test(ua)?'iOS':/Mac OS/i.test(ua)?'macOS':/Linux/i.test(ua)?'Linux':'Unknown OS';let br=/Edg\//i.test(ua)?'Edge':/Chrome\//i.test(ua)?'Chrome':/Firefox\//i.test(ua)?'Firefox':/Safari\//i.test(ua)?'Safari':'Browser';return (/Mobi|Android|iPhone|iPad/i.test(ua)?'Mobile':'Desktop')+' · '+os+' · '+br}
function render(){const q=$('search').value.toLowerCase().trim(),t=$('type').value;const rows=all.filter(x=>(!t||x.event_type===t)&&(!q||JSON.stringify(x).toLowerCase().includes(q))).slice(0,1000);$('rows').innerHTML=rows.map(x=>{const u=x.visitor,name=u?.full_name||u?.display_name||'Anonymous visitor',email=u?.email||'Not signed in',loc=[x.city,x.region,x.country].filter(Boolean).join(', ')||'Location unavailable',action=x.target||x.metadata?.title||'—';return '<tr><td>'+esc(new Date(x.created_at).toLocaleString())+'</td><td class="user"><strong>'+esc(name)+'</strong><span>'+esc(email)+'</span></td><td class="location">'+esc(loc)+'<br><small>'+esc(x.timezone||'')+'</small></td><td><code>'+esc(x.ip_address||'—')+'</code></td><td>'+esc(x.page_path||'—')+'</td><td><span class="pill">'+esc(x.event_type)+'</span><br><small>'+esc(action)+'</small></td><td><code>'+esc(x.session_id||'—')+'</code></td><td><small>'+esc(device(x.user_agent))+'</small></td></tr>'}).join('')||'<tr><td colspan="8" class="empty">No events found for this period.</td></tr>'}
function getStoredAccessToken(){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(k.startsWith('sb-')&&k.endsWith('-auth-token')){const raw=localStorage.getItem(k);if(raw){const o=JSON.parse(raw);if(o?.access_token)return o.access_token}}}}catch(e){}return null}
async function getToken(){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(k.startsWith('sb-')&&k.endsWith('-auth-token')){const raw=localStorage.getItem(k);if(raw){const o=JSON.parse(raw);if(o?.access_token)return o.access_token}}}}catch(e){}return null}
async function load(){try{$('status').textContent='🔐 Reading secure session…';const token=await getToken();if(!token){$('status').innerHTML='<span class="danger">No active admin session. Please sign in again.</span>';$('loginBox').style.display='block';return}$('status').textContent='🔐 Loading protected analytics…';const days=Number($('range').value);const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);let r;try{r=await fetch(URL+'/functions/v1/visitor-analytics?days='+days,{headers:{apikey:KEY,Authorization:'Bearer '+token,Accept:'application/json'},signal:controller.signal})}finally{clearTimeout(timer)}const body=await r.json().catch(()=>({}));if(!r.ok){$('status').innerHTML='<span class="danger">Analytics error: '+esc(body.error||('HTTP '+r.status))+'</span>';return}all=body.events||[];lastLoadedAt=new Date();$('adminIdentity').textContent='Signed in as '+(body.admin?.full_name||body.admin?.email||'Administrator');$('events').textContent=all.length.toLocaleString();$('sessions').textContent=new Set(all.map(x=>x.session_id).filter(Boolean)).size.toLocaleString();$('visitors').textContent=new Set(all.map(x=>x.user_id||('anon:'+x.session_id))).size.toLocaleString();$('registered').textContent=new Set(all.map(x=>x.user_id).filter(Boolean)).size.toLocaleString();$('cities').textContent=new Set(all.map(x=>x.city).filter(Boolean)).size.toLocaleString();$('status').innerHTML='<b>Protected</b> · '+all.length.toLocaleString()+' events · Last updated '+lastLoadedAt.toLocaleTimeString()+' · Auto refresh: 15s';$('app').style.display='block';render()}catch(e){$('status').innerHTML='<span class="danger">Dashboard error: '+esc(e?.message||e)+'</span>'}}
$('refresh').onclick=load;$('range').onchange=load;setInterval(load,15000);$('type').onchange=render;$('search').oninput=render;$('logout').onclick=async()=>{try{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i)||'';if(k.startsWith('sb-')&&k.endsWith('-auth-token'))localStorage.removeItem(k)}}catch(e){}location.replace('login.html')};load();
</script></body></html>
