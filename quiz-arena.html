<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Arena — PrinceXmahto</title><style>:root{--bg:#f5f5f7;--ink:#111114;--muted:#6e6e73;--blue:#0071e3;--line:#dddde2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#dcecff,transparent 35%),var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(820px,calc(100% - 30px));margin:auto}.top{padding:20px 0;display:flex;justify-content:space-between}.brand{font-weight:800}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.15em}.back{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:#fff}.hero{padding:55px 0 25px}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.15em}.hero h1{font-size:clamp(44px,8vw,72px);line-height:.95;letter-spacing:-.06em;margin:10px 0}.hero p{color:var(--muted);font-size:18px}.panel{background:rgba(255,255,255,.82);border:1px solid #fff;border-radius:28px;padding:28px;box-shadow:0 25px 70px rgba(0,0,0,.1);backdrop-filter:blur(18px)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:18px}.question{font-size:24px;font-weight:750;letter-spacing:-.03em;margin:10px 0 22px}.options{display:grid;gap:10px}.option{width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);padding:14px 16px;border-radius:14px;font:inherit;cursor:pointer}.option:hover{border-color:var(--blue)}.option.selected{border:2px solid var(--blue);padding:13px 15px}.actions{display:flex;justify-content:space-between;margin-top:24px;gap:10px}.btn{border:0;border-radius:13px;padding:12px 17px;background:var(--ink);color:#fff;font-weight:700;cursor:pointer}.btn.blue{background:var(--blue)}.btn:disabled{opacity:.4;cursor:not-allowed}.result{text-align:center;padding:35px 10px}.score{font-size:60px;font-weight:850;letter-spacing:-.06em}.hidden{display:none}.footer{color:var(--muted);font-size:13px;padding:25px 0 50px}@media(max-width:600px){.panel{padding:20px}.question{font-size:21px}.actions{flex-direction:column-reverse}.btn{width:100%}}</style></head><body><header class="top wrap"><a class="brand" href="index.html">PX / QUIZ ARENA<small>LEARN / TEST / IMPROVE</small></a><a class="back" href="projects.html">← Projects</a></header><main class="wrap"><section class="hero"><div class="eyebrow">STUDENT PRACTICE · LIVE</div><h1>Test what<br>you know.</h1><p>A small browser quiz for quick practice. Start, answer, review your score, and try again.</p></section><section class="panel" id="quiz"><div class="meta"><span id="progress">Question 1 / 8</span><span id="scoreLive">Score: 0</span></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="actions"><button class="btn" id="restart" onclick="restart()">Restart</button><button class="btn blue" id="next" onclick="next()" disabled>Next →</button></div></section><section class="panel hidden" id="result"><div class="result"><div class="eyebrow">QUIZ COMPLETE</div><div class="score" id="finalScore">0/8</div><p id="message"></p><button class="btn blue" onclick="restart()">Try Again</button></div></section></main><footer class="footer wrap">PX Quiz Arena · A PrinceXmahto student project</footer><script>const qs=[['Which language is primarily used to structure a web page?',['HTML','CSS','SQL','Python'],0],['Which CSS property changes text color?',['font-style','color','text-align','display'],1],['Which keyword declares a block-scoped variable in JavaScript?',['var','let','define','constvar'],1],['What does API commonly stand for?',['Application Programming Interface','Applied Program Input','Advanced Page Index','Application Process Internet'],0],['Which Git command uploads local commits to a remote repository?',['git pull','git clone','git push','git init'],2],['Which HTML element creates a hyperlink?',['<link>','<a>','<href>','<url>'],1],['Which storage API keeps key-value data in the browser?',['localStorage','browserSQL','sessionFile','webCache'],0],['What is the usual purpose of responsive design?',['Make pages work across screen sizes','Increase file size','Disable mobile layouts','Remove CSS'],0]];let i=0,score=0,selected=-1;const $=x=>document.getElementById(x);function render(){selected=-1;$('next').disabled=true;$('progress').textContent=`Question ${i+1} / ${qs.length}`;$('scoreLive').textContent=`Score: ${score}`;$('question').textContent=qs[i][0];$('options').innerHTML=qs[i][1].map((o,n)=>`<button class="option" onclick="choose(${n})">${o}</button>`).join('')}function choose(n){selected=n;document.querySelectorAll('.option').forEach((b,j)=>b.classList.toggle('selected',j===n));$('next').disabled=false}function next(){if(selected<0)return;if(selected===qs[i][2])score++;i++;if(i<qs.length)render();else finish()}function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('finalScore').textContent=`${score}/${qs.length}`;$('message').textContent=score===qs.length?'Perfect run.':score>=6?'Strong work — keep practicing.':score>=4?'Good start — review the missed topics and try again.':'Keep going — another attempt will help you learn.'}function restart(){i=0;score=0;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}render();</script></body></html>
