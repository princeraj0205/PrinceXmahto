<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — PrinceXmahto</title><link rel="stylesheet" href="auth.css"><script src="auth-config.js"></script></head><body data-mode="login"><main class="auth-shell"><section class="auth-card"><a class="logo" href="index.html"><span class="logo-mark">PX</span>PrinceXmahto</a><h1>Welcome back.</h1><p class="sub">Sign in to your PrinceXmahto account.</p><button id="google" class="google">Continue with Google</button><div class="divider">OR</div><form id="authForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password"></div><button type="submit">Sign in</button></form><div class="divider">EMAIL OTP</div><button id="otpSend" class="google">Send one-time code</button><div id="otpBox" class="otp"><div class="field"><label>6-digit OTP</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="123456"></div><button id="otpVerify" type="button">Verify OTP</button></div><div class="links"><a id="reset" href="#">Forgot password?</a><a href="register.html">Create account</a></div><div id="msg" class="msg" aria-live="polite"></div></section></main><script src="auth.js"></script></body></html>
