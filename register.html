<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — PrinceXmahto</title><link rel="stylesheet" href="auth.css"><script src="auth-config.js"></script></head><body data-mode="register"><main class="auth-shell"><section class="auth-card"><a class="logo" href="index.html"><span class="logo-mark">PX</span>PrinceXmahto</a><h1>Create account.</h1><p class="sub">Join the PrinceXmahto digital workspace.</p><button id="google" class="google">Continue with Google</button><div class="divider">OR</div><form id="authForm"><div class="field"><label>Name</label><input id="name" type="text" autocomplete="name" required placeholder="Your name"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></div><button type="submit">Create account</button></form><div class="links"><span></span><a href="login.html">Already have an account?</a></div><div id="msg" class="msg" aria-live="polite"></div></section></main><script src="auth.js"></script></body></html>
