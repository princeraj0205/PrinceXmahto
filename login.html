<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login — PrinceXmahto</title><link rel="stylesheet" href="auth.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-config.js"></script>
<style>
body{background:#050d18!important;color:#f7fbff}.auth-shell{min-height:100vh;background:radial-gradient(circle at 15% 5%,#12304d 0,#050d18 45%,#020711 100%);display:grid;place-items:center;padding:24px}.auth-card{width:min(460px,100%);padding:38px;border:1px solid #203852;border-radius:28px;background:rgba(8,21,37,.94);box-shadow:0 30px 100px rgba(0,0,0,.45);backdrop-filter:blur(18px)}.logo{display:flex;align-items:center;gap:12px;color:#d4af37;font-weight:900;letter-spacing:.08em}.logo-mark{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#050d18;border:1px solid #d4af37;color:#fff}.auth-card h1{font-size:34px;margin:25px 0 7px}.sub{color:#91a7bd}.field label{color:#b9cce0}.field input{background:#071321!important;color:#fff!important;border-color:#203852!important}.auth-card button[type=submit],#reset{background:linear-gradient(135deg,#d4af37,#f2d36b);color:#07101c;border:0}.links a{color:#d4af37}.msg.ok{color:#68d391}.msg.danger{color:#ff8e8e}
</style></head>
<body><main class="auth-shell"><section class="auth-card">
<a class="logo" href="index.html"><span class="logo-mark">PX</span>PRINCEXMAHTO</a>
<h1 id="title">Admin Access</h1><p id="sub" class="sub">Private administrator console. Authorized access only.</p>
<form id="authForm"><div class="field"><label>Username</label><input id="username" autocomplete="username" required value="princeraj0205"></div>
<div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Administrator password"></div>
<div id="confirmWrap" class="field" style="display:none"><label>Confirm New Password</label><input id="confirm" type="password" autocomplete="new-password"></div>
<button id="submit" type="submit">Unlock Admin Dashboard →</button></form>
<div class="links"><a id="reset" href="#">Forgot password?</a></div><div id="msg" class="msg" aria-live="polite"></div>
</section></main>
<script>
const S=supabase.createClient(window.PX_SUPABASE_URL,window.PX_SUPABASE_KEY), ADMIN_EMAIL='princeraj74682@gmail.com';
const form=document.getElementById('authForm'),msg=document.getElementById('msg'),reset=document.getElementById('reset'),title=document.getElementById('title'),sub=document.getElementById('sub'),submit=document.getElementById('submit'),username=document.getElementById('username'),password=document.getElementById('password'),confirm=document.getElementById('confirm'),confirmWrap=document.getElementById('confirmWrap');
function show(t,c=''){msg.textContent=t;msg.className='msg '+c}
function recoveryMode(){title.textContent='Reset Admin Password';sub.textContent='Create a new password for the administrator account.';username.parentElement.style.display='none';confirmWrap.style.display='block';submit.textContent='Update Password →';reset.style.display='none';form.dataset.recovery='1'}
S.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY') recoveryMode()});
form.addEventListener('submit',async e=>{e.preventDefault();
if(form.dataset.recovery==='1'){const p=password.value;if(p.length<8){show('Password must be at least 8 characters.','danger');return}if(p!==confirm.value){show('Passwords do not match.','danger');return}submit.disabled=true;const {error}=await S.auth.updateUser({password:p});if(error){show(error.message,'danger');submit.disabled=false;return}show('Password updated successfully. Returning to Admin Login…','ok');await S.auth.signOut();setTimeout(()=>location.href='login.html',1200);return}
const u=username.value.trim(),p=password.value;if(u!=='princeraj0205'){show('Invalid administrator credentials.','danger');return}show('Authenticating administrator…');submit.disabled=true;
const {data,error}=await S.auth.signInWithPassword({email:ADMIN_EMAIL,password:p});if(error||!data.user){show('Invalid administrator credentials.','danger');submit.disabled=false;return}
const {data:profile}=await S.from('profiles').select('role').eq('id',data.user.id).maybeSingle();if(profile?.role!=='admin'){await S.auth.signOut();show('Administrator authorization failed.','danger');submit.disabled=false;return}
show('Access granted. Opening secure dashboard…','ok');location.href='admin.html?v='+Date.now()});
reset.onclick=async e=>{e.preventDefault();reset.textContent='Sending reset link…';const {error}=await S.auth.resetPasswordForEmail(ADMIN_EMAIL,{redirectTo:location.origin+location.pathname});if(error){show(error.message,'danger');reset.textContent='Forgot password?';return}show('Reset link sent to administrator email.','ok');reset.textContent='Reset email sent ✓'};
</script></body></html>
